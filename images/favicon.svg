<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#058241"/>
      <stop offset="100%" stop-color="#023d1e"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Bottle Graphic with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="47" y="16" width="34" height="15" rx="3.5" fill="url(#capGrad)"/>
    <!-- Cap Ridges -->
    <line x1="53" y1="18" x2="53" y2="29" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="58" y1="18" x2="58" y2="29" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="64" y1="18" x2="64" y2="29" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="70" y1="18" x2="70" y2="29" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="75" y1="18" x2="75" y2="29" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Neck Ring -->
    <rect x="49" y="30" width="30" height="3" rx="1.5" fill="#f1f5f9"/>

    <!-- Bottle Body -->
    <rect x="36" y="32" width="56" height="76" rx="13" fill="#ffffff"/>

    <!-- Tag Badge 30 Kapsul on Shoulder -->
    <rect x="74" y="40" width="14" height="14" rx="2" fill="#0f172a"/>
    <text x="81" y="50" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">30</text>

    <!-- MD EMPIRE Green Box -->
    <rect x="50" y="42" width="20" height="8" rx="1.5" fill="none" stroke="#058241" stroke-width="1.2"/>
    <text x="60" y="48.5" font-family="sans-serif" font-size="4.5" font-weight="bold" fill="#058241" text-anchor="middle">MD</text>

    <!-- Title on Bottle -->
    <text x="64" y="60" font-family="sans-serif" font-size="5" font-weight="bold" fill="#334155" text-anchor="middle" letter-spacing="0.5">KAPSUL</text>
    <text x="64" y="69" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-0.2">RESDUNG</text>
    <text x="64" y="74.5" font-family="sans-serif" font-size="4" font-weight="600" fill="#058241" text-anchor="middle">SB</text>

    <!-- Bottom Green Swoosh Wave on Bottle -->
    <path d="M 36 86 Q 50 82 64 89 T 92 84 L 92 95 Q 92 108 79 108 L 49 108 Q 36 108 36 95 Z" fill="#058241"/>

    <!-- Green Nose Silhouette Accent -->
    <path d="M 76 77 C 79 81 83 83 83 86 C 83 89 80 90 77 88" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
